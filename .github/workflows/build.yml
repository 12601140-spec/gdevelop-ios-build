name: Build iOS IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Unzip Project Files
        run: |
          unzip project.zip -d ./unzipped_temp
          rm project.zip
          # フォルダごとZIP化されている場合、中身をカレントディレクトリに引き出す
          if [ -f ./unzipped_temp/config.xml ]; then
            mv ./unzipped_temp/* ./
          else
            mv ./unzipped_temp/*/* ./
          fi
          rm -rf ./unzipped_temp

      - name: Create Cordova Project Framework
        run: |
          cordova create myApp com.example.myapp MyApp
          cd myApp
          cordova platform add ios

      - name: Copy GDevelop Web Files
        run: |
          rm -rf myApp/www/*
          cp -R ./www/* myApp/www/
          cp config.xml myApp/
          cp package.json myApp/
          rm -rf myApp/www/myApp
          rm -rf myApp/www/.github

      - name: Bypass Apple Code Signing
        run: |
          cd myApp/platforms/ios
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' '/DEVELOPMENT_TEAM/d' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = "Don\x27t Code Sign"/g' {} +

      - name: Build iOS Xcode Project (No Signing)
        run: |
          cd myApp
          xcodebuild -workspace MyApp.xcworkspace -scheme MyApp -configuration Release -sdk iphoneos -archivePath MyApp.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="Don't Code Sign"

      - name: Package Payload into IPA
        run: |
          cd myApp
          mkdir Payload
          cp -R MyApp.xcarchive/Products/Applications/MyApp.app Payload/
          zip -r ../game.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-game-ipa
          path: game.ipa
