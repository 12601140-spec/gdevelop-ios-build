name: Build iOS IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Unzip Project Files
        run: |
          unzip project.zip -d ./
          rm project.zip

      - name: Create Cordova Project Framework
        run: |
          cordova create myApp com.example.myapp MyApp
          cd myApp
          cordova platform add ios

      - name: Copy GDevelop Web Files
        run: |
          rm -rf myApp/www/*
          cp -R ./www/* myApp/www/
          cp config.xml myApp/
          cp package.json myApp/
          rm -rf myApp/www/myApp
          rm -rf myApp/www/.github

      - name: Build iOS Xcode Project (No Signing)
        run: |
          cd myApp
          cat <<EOF > build.json
          {
            "ios": {
              "release": {
                "codeSignIdentity": "Don't Code Sign",
                "packageType": "adhoc"
              }
            }
          }
          EOF
          cordova build ios --device --release --buildConfig=build.json -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package Payload into IPA
        run: |
          cd myApp/platforms/ios/build/device
          mkdir Payload
          cp -R MyApp.app Payload/
          zip -r ../../../../../game.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-game-ipa
          path: game.ipa
